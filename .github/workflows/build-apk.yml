name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths:
      - "**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and Extract Android Project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          # Search for an existing Android Gradle project.
          settings_file="$(find . -maxdepth 8 -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path './.github-workspace/*' \
            -print -quit)"

          # If no project exists, find and extract a ZIP file.
          if [[ -z "$settings_file" ]]; then
            zip_file="$(find . -maxdepth 5 -type f \
              -iname '*.zip' \
              -not -path './.github-workspace/*' \
              -print -quit)"

            if [[ -z "$zip_file" ]]; then
              echo "::error::No Android project or ZIP file found."
              echo "Upload the Android project ZIP to your repository."
              exit 1
            fi

            echo "Found ZIP: $zip_file"

            mkdir -p .github-workspace/project
            unzip -oq "$zip_file" -d .github-workspace/project

            settings_file="$(find .github-workspace/project -maxdepth 10 \
              -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print -quit)"
          fi

          if [[ -z "$settings_file" ]]; then
            echo "::error::Could not find settings.gradle or settings.gradle.kts."
            echo "Check that the ZIP contains the Android Gradle project."
            exit 1
          fi

          project_dir="$(dirname "$settings_file")"
          project_dir="$(realpath "$project_dir")"

          echo "Android project directory: $project_dir"
          echo "dir=$project_dir" >> "$GITHUB_OUTPUT"

          echo "Project files:"
          ls -la "$project_dir"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"

          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::Could not find Android SDK sdkmanager."
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses

      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          project_dir="${{ steps.project.outputs.dir }}"

          if [[ ! -f "$project_dir/gradlew" ]]; then
            echo "::error::gradlew is missing from the project."
            exit 1
          fi

          if [[ ! -f "$project_dir/gradle/wrapper/gradle-wrapper.properties" ]]; then
            echo "::error::gradle-wrapper.properties is missing."
            exit 1
          fi

          chmod +x "$project_dir/gradlew"

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          project_dir="${{ steps.project.outputs.dir }}"
          cd "$project_dir"

          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: "${{ steps.project.outputs.dir }}/**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
          retention-days: 14
